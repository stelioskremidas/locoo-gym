<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locoo Gym</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header class="topbar">

<div class="logo">

🏋️ <span>Locoo Gym</span>

</div>


<div class="user">

Admin

</div>


</header>





<aside class="sidebar">


<button onclick="openPage('dashboard')">
📊 Dashboard
</button>


<button onclick="openPage('clients')">
👥 Πελάτες
</button>


<button onclick="openPage('appointments')">
📅 Ραντεβού
</button>


<button onclick="openPage('trainers')">
🏋️ Trainers
</button>


<button onclick="openPage('payments')">
💰 Οικονομικά
</button>


<button onclick="openPage('settings')">
⚙️ Ρυθμίσεις
</button>



</aside>





<main class="content">





<section id="dashboard" class="page">


<h1>
Dashboard
</h1>



<div class="stats">


<div class="box">

<h3>
Μέλη
</h3>

<strong id="membersCount">
0
</strong>

</div>



<div class="box">

<h3>
Σήμερα
</h3>

<strong id="todayAppointments">
0
</strong>

</div>




<div class="box">

<h3>
Έσοδα
</h3>

<strong id="income">
0 €
</strong>


</div>




<div class="box">

<h3>
Ενεργοί Trainers
</h3>

<strong id="trainersCount">
0
</strong>

</div>



</div>



</section>







<section id="clients" class="page hidden">


<h1>
Πελάτες
</h1>



<div class="panel">


<input 
id="clientName"
placeholder="Όνομα πελάτη">


<input 
id="clientPhone"
placeholder="Τηλέφωνο">


<button onclick="addClient()">
+ Προσθήκη
</button>


</div>



<div id="clientsList">

</div>



</section>









<section id="appointments" class="page hidden">


<h1>
Ραντεβού
</h1>



<div class="panel">


<input 
placeholder="Όνομα πελάτη">


<input 
type="date">


<button>
Κράτηση
</button>


</div>



<div class="empty">

Το σύστημα ραντεβού θα συνδεθεί με Supabase

</div>



</section>










<section id="trainers" class="page hidden">


<h1>
Trainers
</h1>


<div class="empty">

Διαχείριση προπονητών

</div>


</section>









<section id="payments" class="page hidden">


<h1>
Οικονομικά
</h1>



<div class="empty">

Συνδρομές - Πληρωμές - Αποδείξεις

</div>


</section>









<section id="settings" class="page hidden">


<h1>
Ρυθμίσεις

</h1>


<div class="empty">

Ρυθμίσεις εφαρμογής

</div>


</section>







</main>


</div>





<script src="supabase.js"></script>
<script src="app.js"></script>

<script>
console.log("HTML loaded");
</script>>


</body>


</html>
