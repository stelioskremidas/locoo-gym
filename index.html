<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locoo Gym</title>

<style>
body {
font-family: Arial, sans-serif;
background:#f4f4f4;
padding:20px;
}

h1 {
text-align:center;
}

.card {
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

input, button, select {
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button {
background:#111;
color:white;
}

.hidden {
display:none;
}

.item {
background:#eee;
padding:12px;
border-radius:10px;
margin-top:10px;
}
</style>

</head>

<body>


<div id="loginPage" class="card">

<h1>🏋️ Locoo Gym</h1>

<h3>Είσοδος με PIN</h3>

<input id="pin" type="password" placeholder="Βάλε PIN">

<button onclick="login()">
Είσοδος
</button>

</div>



<div id="appPage" class="hidden">

<h1>🏋️ Locoo Gym</h1>

<div class="card">

<h3>Χρήστης:</h3>

<div id="user"></div>

</div>


<div class="card">

<h2>📅 Ραντεβού</h2>

<input id="client" placeholder="Όνομα πελάτη">

<input id="date" type="date">

<input id="time" type="time">


<select id="trainer">

<option>Coach</option>

<option>Trainer 1</option>

</select>


<button onclick="saveAppointment()">
Αποθήκευση Ραντεβού
</button>


<div id="appointments"></div>

</div>


</div>
<script>

let currentUser = "";


function login(){

let pin = document.getElementById("pin").value;


if(pin === "1234"){

currentUser = "Coach";

}

else if(pin === "1111"){

currentUser = "Trainer 1";

}

else {

alert("Λάθος PIN");
return;

}


document.getElementById("loginPage").classList.add("hidden");

document.getElementById("appPage").classList.remove("hidden");

document.getElementById("user").innerHTML =
"👤 " + currentUser;


showAppointments();

}



function saveAppointment(){

let appointment = {

client: document.getElementById("client").value,

date: document.getElementById("date").value,

time: document.getElementById("time").value,

trainer: document.getElementById("trainer").value

};


let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];


appointments.push(appointment);


localStorage.setItem(
"appointments",
JSON.stringify(appointments)
);


showAppointments();

}



function showAppointments(){

let box =
document.getElementById("appointments");


box.innerHTML="";


let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];



appointments.forEach(a=>{


if(currentUser==="Coach" || a.trainer===currentUser){


box.innerHTML += `

<div class="item">

👤 ${a.client}<br>

📅 ${a.date}<br>

⏰ ${a.time}<br>

🏋️ ${a.trainer}

</div>

`;

}


});


}


</script>


</body>
</html>
