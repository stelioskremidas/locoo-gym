<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locoo Gym</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background: #111;
  color: white;
  cursor: pointer;
}

.item {
  background: #eee;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>🏋️ Locoo Gym</h1>

<div class="card">
<h2>👥 Νέος Πελάτης</h2>

<input id="name" placeholder="Ονοματεπώνυμο">
<input id="phone" placeholder="Τηλέφωνο">
<input id="money" placeholder="Χρήματα (€)">

<button onclick="addClient()">Αποθήκευση</button>

</div>


<div class="card">
<h2>Πελάτες</h2>
<div id="clients"></div>
</div>


<script>

function addClient(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let money=document.getElementById("money").value;

let clients=JSON.parse(localStorage.getItem("clients")) || [];

clients.push({
name:name,
phone:phone,
money:money
});

localStorage.setItem("clients",JSON.stringify(clients));

showClients();

}


function showClients(){

let box=document.getElementById("clients");
box.innerHTML="";

let clients=JSON.parse(localStorage.getItem("clients")) || [];

clients.forEach(c=>{

box.innerHTML += `
<div class="item">
<b>${c.name}</b><br>
📞 ${c.phone}<br>
💰 ${c.money} €
</div>
`;

});

}

showClients();

</script>

</body>
</html>
